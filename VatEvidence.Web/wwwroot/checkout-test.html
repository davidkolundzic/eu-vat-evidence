<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VatEvidence - Stripe Checkout Test</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 600px;
      margin: 50px auto;
      padding: 20px;
      background: #f5f5f5;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h1 {
      margin-top: 0;
      color: #333;
    }
    label {
      display: block;
      margin-top: 15px;
      font-weight: 600;
      color: #555;
    }
    input, select {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: 1px solid #ddd;
      border-radius: 4px;
      box-sizing: border-box;
    }
    button {
      margin-top: 20px;
      width: 100%;
      padding: 12px;
      background: #635bff;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover {
      background: #4f46e5;
    }
    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    .info {
      margin-top: 15px;
      padding: 10px;
      background: #f0f9ff;
      border: 1px solid #bfdbfe;
      border-radius: 4px;
      font-size: 14px;
      color: #1e40af;
    }
    .error {
      margin-top: 15px;
      padding: 10px;
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 4px;
      font-size: 14px;
      color: #991b1b;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🧾 VAT Evidence Checkout</h1>
    <p>Test Stripe Checkout Session creation with IP evidence capture</p>

    <form id="checkoutForm">
      <label for="workspaceId">Workspace ID</label>
      <input type="text" id="workspaceId" placeholder="00000000-0000-0000-0000-000000000001" required>

      <label for="mode">Mode</label>
      <select id="mode" required>
        <option value="test">Test</option>
        <option value="live">Live</option>
      </select>

      <label for="amount">Amount (minor units, e.g. 1000 = 10.00)</label>
      <input type="number" id="amount" value="1000" required>

      <label for="currency">Currency</label>
      <input type="text" id="currency" value="EUR" maxlength="3" required>

      <label for="productName">Product Name</label>
      <input type="text" id="productName" value="Test Product" required>

      <label for="email">Customer Email</label>
      <input type="email" id="email" placeholder="buyer@example.com">

      <button type="submit" id="submitBtn">Create Checkout Session</button>
    </form>

    <div id="info" style="display:none;" class="info"></div>
    <div id="error" style="display:none;" class="error"></div>
  </div>

  <script>
    const form = document.getElementById('checkoutForm');
    const submitBtn = document.getElementById('submitBtn');
    const infoDiv = document.getElementById('info');
    const errorDiv = document.getElementById('error');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      // Clear previous messages
      infoDiv.style.display = 'none';
      errorDiv.style.display = 'none';

      // Disable button
      submitBtn.disabled = true;
      submitBtn.textContent = 'Creating session...';

      const workspaceId = document.getElementById('workspaceId').value;
      const mode = document.getElementById('mode').value;
      const amount = parseInt(document.getElementById('amount').value);
      const currency = document.getElementById('currency').value;
      const productName = document.getElementById('productName').value;
      const email = document.getElementById('email').value;

      try {
        const response = await fetch('/api/stripe/checkout/session', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            workspaceId: workspaceId,
            mode: mode,
            amountMinor: amount,
            currency: currency,
            productName: productName,
            customerEmail: email || null,
            successUrl: window.location.origin + '/success.html?session_id={CHECKOUT_SESSION_ID}',
            cancelUrl: window.location.origin + '/checkout-test.html'
          })
        });

        const data = await response.json();

        if (response.ok && data.checkoutUrl) {
          // Show info
          infoDiv.textContent = `✅ Session created! PI: ${data.paymentIntentId}, TX: ${data.transactionId}, IP: ${data.ipCountry}`;
          infoDiv.style.display = 'block';

          // Redirect to Stripe Checkout
          setTimeout(() => {
            window.location.href = data.checkoutUrl;
          }, 1500);
        } else {
          throw new Error(data.error || 'Failed to create session');
        }
      } catch (err) {
        errorDiv.textContent = '❌ Error: ' + err.message;
        errorDiv.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Create Checkout Session';
      }
    });
  </script>
</body>
</html>
