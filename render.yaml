services:
  # Web service
  - type: web
    name: vatevidence-web
    runtime: docker
    region: frankfurt # ili oregon, singapore...
    plan: starter # free tier, ili standard/pro
    branch: main # ili develop - odredi koji branch
    dockerfilePath: ./Dockerfile
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__Default
        fromDatabase:
          name: vatevidence-db
          property: connectionString
      - key: ASPNETCORE_URLS
        value: http://+:8080
    healthCheckPath: /api/health
    autoDeploy: true

databases:
  # PostgreSQL database
  - name: vatevidence-db
    plan: starter # free tier
    region: frankfurt # ista region kao web service
    databaseName: vatevidence
    user: vatevidence_user
    ipAllowList: [] # prazno = allow from Render services only
